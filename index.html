<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamElements Custom Goal </title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600&display=swap">
    <style>
        :root {
            --bg-color: #0f0f0f;
            --panel-color: #1a1a1a;
            --accent-color: #ff69b4;
            --step-bg: #252525;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .guide-box {
            background: var(--step-bg);
            border-left: 5px solid var(--accent-color);
            padding: 20px;
            border-radius: 10px;
            max-width: 850px;
            width: 100%;
            margin-bottom: 30px;
            font-size: 14px;
        }

        #preview-container {
            width: 100%;
            max-width: 850px;
            height: 250px;
            background-image: linear-gradient(45deg, #181818 25%, transparent 25%), linear-gradient(-45deg, #181818 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #181818 75%), linear-gradient(-45deg, transparent 75%, #181818 75%);
            background-size: 20px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            margin-bottom: 30px;
            border: 2px solid #333;
        }

        /* Preview Widget */
        #goal-wrapper { 
            position: relative; 
            width: 600px; 
            padding: 15px 25px; 
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-sizing: border-box;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .title { font-weight: 600; font-size: 16px; text-transform: uppercase; letter-spacing: 1px; }
        .amount-container { font-weight: 600; }
        .divider { margin: 0 5px; opacity: 0.5; }
        .unit { font-size: 12px; margin-left: 2px; opacity: 0.8; }
        .bar-bg { width: 100%; position: relative; overflow: hidden; background: rgba(0,0,0,0.2); }
        .bar-fill { height: 100%; width: 0%; transition: width 1s ease; }

        .dono-alert { transform: scale(1.05) !important; }
        @keyframes blink-anim { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .flashing { animation: blink-anim 0.5s infinite; }

        /* Editor Styles */
        .editor-panel {
            background: var(--panel-color);
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 850px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 40px;
        }

        .control { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 11px; text-transform: uppercase; opacity: 0.7; font-weight: 600; }
        input, select { background: #222; border: 1px solid #444; color: white; padding: 10px; border-radius: 8px; }
        
        .button-area {
            grid-column: span 3;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        button { padding: 12px 18px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .btn-test { background: var(--accent-color); color: white; }
        .btn-copy { background: #333; color: white; }

        .manual-section {
            width: 100%;
            max-width: 850px;
            display: none;
            flex-direction: column;
            gap: 15px;
            background: #111;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 40px;
        }

        textarea { background: #000; color: #0f0; font-family: monospace; padding: 10px; height: 80px; width: 100%; box-sizing: border-box; font-size: 11px; }

        .toast { position: fixed; bottom: 20px; background: #4CAF50; color: white; padding: 10px 20px; border-radius: 5px; display: none; }
    </style>
</head>
<body>

    <h1>Goal Designer</h1>

    <div id="preview-container">
        <div id="goal-wrapper">
            <div class="header-row">
                <div class="title" id="prev-title">Custom Sub Goal</div>
                <div class="amount-container" id="prev-amount-text">
                    <span id="current-text">0</span><span class="unit" id="prev-unit"></span>
                    <span class="divider">/</span>
                    <span id="target-text">100</span><span class="unit" id="prev-unit2"></span>
                </div>
            </div>
            <div id="prev-bar-bg" class="bar-bg">
                <div id="bar-fill-element" class="bar-fill"></div>
            </div>
        </div>
    </div>

    <div class="editor-panel">
        <div class="control"><label>Mål Type</label>
            <select id="in-type" onchange="handleTypeChange()">
                <option value="subs">Custom Sub Goal</option>
                <option value="tips">Custom Dono Goal</option>
            </select>
        </div>
        <div class="control"><label>Mål Tittel</label><input type="text" id="in-title" value="Custom Sub Goal"></div>
        <div class="control"><label>Enhet (f.eks kr)</label><input type="text" id="in-unit" value=""></div>
        
        <div class="control"><label>Mål Beløp</label><input type="number" id="in-target" value="100"></div>
        <div class="control"><label>Startbeløp (Nå)</label><input type="number" id="in-start" value="20"></div>
        <div class="control"><label>Høyde på bar</label><input type="number" id="in-bar-height" value="14"></div>

        <div class="control"><label>Boks Bakgrunn</label><input type="color" id="in-bg-color" value="#1a1a1a"></div>
        <div class="control"><label>Kant Farge</label><input type="color" id="in-border-color" value="#333333"></div>
        <div class="control"><label>Bar Farge</label><input type="color" id="in-bar-color" value="#ff69b4"></div>
        
        <div class="control"><label>Tittel Farge</label><input type="color" id="in-title-color" value="#ffffff"></div>
        <div class="control"><label>Tall Farge</label><input type="color" id="in-amount-color" value="#ffffff"></div>
        <div class="control"><label>Glow Farge</label><input type="color" id="in-glow-color" value="#ff69b4"></div>

        <div class="control"><label>Hjørner Boks</label><input type="range" id="in-radius-box" min="0" max="50" value="15"></div>
        <div class="control"><label>Hjørner Bar</label><input type="range" id="in-radius-bar" min="0" max="25" value="7"></div>
        <div class="control"><label>Opacity</label><input type="range" id="in-opacity" min="0" max="1" step="0.1" value="0.8"></div>

        <div class="button-area">
            <button class="btn-test" onclick="simulate()">Test Animasjon</button>
            <button class="btn-copy" onclick="copyHTML()">Kopier HTML</button>
            <button class="btn-copy" onclick="copyCSS()">Kopier CSS</button>
            <button class="btn-copy" onclick="copyJS()">Kopier JS</button>
            <button class="btn-copy" onclick="copyFIELDS()">Kopier FIELDS</button>
            <button style="background:#555; color:white" onclick="toggleManual()">Se koder</button>
        </div>
    </div>

    <div id="manual-area" class="manual-section">
        <label>HTML</label><textarea id="raw-html" readonly></textarea>
        <label>CSS</label><textarea id="raw-css" readonly></textarea>
        <label>JS</label><textarea id="raw-js" readonly></textarea>
        <label>FIELDS (JSON)</label><textarea id="raw-fields" readonly></textarea>
    </div>

    <div id="toast" class="toast">Kopiert!</div>

    <script>
        function handleTypeChange() {
            const type = document.getElementById('in-type').value;
            if (type === 'subs') {
                document.getElementById('in-title').value = "Custom Sub Goal";
                document.getElementById('in-unit').value = "";
                document.getElementById('in-target').value = 100;
            } else {
                document.getElementById('in-title').value = "Custom Dono Goal";
                document.getElementById('in-unit').value = "kr";
                document.getElementById('in-target').value = 1000;
            }
            update();
        }

        function update() {
            const wrap = document.getElementById('goal-wrapper');
            const bar = document.getElementById('bar-fill-element');
            const barBg = document.getElementById('prev-bar-bg');
            
            const title = document.getElementById('in-title').value;
            const target = document.getElementById('in-target').value;
            const start = document.getElementById('in-start').value;
            const unit = document.getElementById('in-unit').value;
            const opacity = document.getElementById('in-opacity').value;
            const bgColor = hexToRgbA(document.getElementById('in-bg-color').value, opacity);

            document.getElementById('prev-title').innerText = title;
            document.getElementById('prev-title').style.color = document.getElementById('in-title-color').value;
            document.getElementById('current-text').innerText = start;
            document.getElementById('target-text').innerText = target;
            document.getElementById('prev-unit').innerText = unit;
            document.getElementById('prev-unit2').innerText = unit;
            document.getElementById('prev-amount-text').style.color = document.getElementById('in-amount-color').value;

            wrap.style.backgroundColor = bgColor;
            wrap.style.borderColor = document.getElementById('in-border-color').value;
            wrap.style.borderRadius = document.getElementById('in-radius-box').value + "px";
            bar.style.backgroundColor = document.getElementById('in-bar-color').value;
            bar.style.borderRadius = document.getElementById('in-radius-bar').value + "px";
            barBg.style.borderRadius = document.getElementById('in-radius-bar').value + "px";
            barBg.style.height = document.getElementById('in-bar-height').value + "px";
            
            const perc = Math.min((start / target) * 100, 100);
            bar.style.width = perc + "%";

            document.getElementById('raw-html').value = getHTML();
            document.getElementById('raw-css').value = getCSS();
            document.getElementById('raw-js').value = getJS();
            document.getElementById('raw-fields').value = getFIELDS();
        }

        function hexToRgbA(hex, op){
            var c;
            if(/^#([A-Fa-f0-9]{3}){1,2}$/.test(hex)){
                c= hex.substring(1).split('');
                if(c.length== 3) c= [c[0], c[0], c[1], c[1], c[2], c[2]];
                c= '0x'+c.join('');
                return 'rgba('+[(c>>16)&255, (c>>8)&255, c&255].join(',')+','+op+')';
            }
        }

        function getHTML() {
            return `<div id="goal-wrapper" style="background: {{bg_color}}; border: {{border_width}}px solid {{border_color}}; border-radius: {{container_radius}}px;">
    <div class="header-row">
        <div class="title" style="color: {{title_color}};">{{goal_title}}</div>
        <div class="amount-container" style="color: {{amount_color}};">
            <span id="current-text">0</span><span class="unit">{{goal_unit}}</span>
            <span class="divider">/</span>
            <span id="target-text">{{goal_amount}}</span><span class="unit">{{goal_unit}}</span>
        </div>
    </div>
    <div class="bar-bg" style="height: {{bar_height}}px; border-radius: {{bar_radius}}px; background: {{bar_bg_color}};">
        <div id="bar-fill-element" class="bar-fill" style="background: {{bar_color}}; border-radius: {{bar_radius}}px;"></div>
    </div>
</div>`;
        }

        function getCSS() {
            return `@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600&display=swap');
#goal-wrapper { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 600px; padding: 15px 25px; backdrop-filter: blur(8px); font-family: 'Outfit', sans-serif; transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-sizing: border-box; }
.header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.title { font-weight: 600; font-size: 16px; text-transform: uppercase; letter-spacing: 1px; }
.amount-container { font-weight: 600; }
.divider { margin: 0 5px; opacity: 0.5; }
.unit { font-size: 12px; margin-left: 2px; opacity: 0.8; }
.bar-bg { width: 100%; position: relative; overflow: hidden; }
.bar-fill { height: 100%; width: 0%; transition: width 1s ease; }
.dono-alert { border-color: {{glow_color}} !important; box-shadow: 0 0 40px {{glow_color}} !important; transform: translateX(-50%) scale(1.05) !important; }
.pink-flash { animation: blink-anim 0.5s infinite; }
@keyframes blink-anim { 0% { background: {{bar_color}}; } 50% { background: {{blink_color}}; } 100% { background: {{bar_color}}; } }`;
        }

        function getJS() {
            return `let goalTarget = 0; let sessionTotal = 0; let startAmount = 0; let goalType = "tips";
window.addEventListener('onWidgetLoad', function (obj) {
    const fieldData = obj.detail.fieldData;
    const sessionData = obj.detail.session.data;
    goalTarget = fieldData.goal_amount || 1000;
    startAmount = parseFloat(fieldData.current_amount) || 0; 
    goalType = fieldData.goal_type || "tips";
    if (goalType === "tips") {
        if (sessionData['tips-session']) sessionTotal = sessionData['tips-session']['amount'] || 0;
    } else {
        if (sessionData['subscriber-session']) sessionTotal = sessionData['subscriber-session']['count'] || 0;
    }
    document.getElementById('target-text').innerText = goalTarget;
    render(false);
});
window.addEventListener('onEventReceived', function (obj) {
    const listener = obj.detail.listener;
    if (goalType === "tips" && listener === 'tip-latest') {
        sessionTotal += parseFloat(obj.detail.event.amount);
        render(true);
    } else if (goalType === "subs" && (listener === 'subscriber-latest' || listener === 'resub-latest')) {
        sessionTotal += 1;
        render(true);
    }
});
function render(isAlert) {
    const totalToDisplay = startAmount + sessionTotal;
    const percent = Math.min((totalToDisplay / goalTarget) * 100, 100);
    const bar = document.getElementById('bar-fill-element');
    const wrap = document.getElementById('goal-wrapper');
    if (bar) bar.style.width = percent + "%";
    document.getElementById('current-text').innerText = Math.floor(totalToDisplay);
    if (isAlert) {
        wrap.classList.add('dono-alert'); bar.classList.add('pink-flash');
        setTimeout(() => { wrap.classList.remove('dono-alert'); bar.classList.remove('pink-flash'); }, 4000);
    }
}`;
        }

        function getFIELDS() {
            const fields = {
                "goal_title": { "type": "text", "label": "Mål Tittel", "value": document.getElementById('in-title').value },
                "goal_type": { "type": "dropdown", "label": "Mål Type", "value": document.getElementById('in-type').value, "options": { "tips": "Tips", "subs": "Subs" } },
                "goal_unit": { "type": "text", "label": "Enhet", "value": document.getElementById('in-unit').value },
                "goal_amount": { "type": "number", "label": "Mål", "value": parseInt(document.getElementById('in-target').value) },
                "current_amount": { "type": "number", "label": "Startbeløp", "value": parseInt(document.getElementById('in-start').value) },
                "bg_color": { "type": "colorpicker", "label": "Bakgrunn", "value": hexToRgbA(document.getElementById('in-bg-color').value, document.getElementById('in-opacity').value) },
                "border_color": { "type": "colorpicker", "label": "Kant", "value": document.getElementById('in-border-color').value },
                "border_width": { "type": "slider", "label": "Kant Tykkelse", "value": 2, "min": 0, "max": 10, "step": 1 },
                "container_radius": { "type": "slider", "label": "Hjørner Boks", "value": parseInt(document.getElementById('in-radius-box').value), "min": 0, "max": 50, "step": 1 },
                "title_color": { "type": "colorpicker", "label": "Tittel Farge", "value": document.getElementById('in-title-color').value },
                "amount_color": { "type": "colorpicker", "label": "Tall Farge", "value": document.getElementById('in-amount-color').value },
                "bar_color": { "type": "colorpicker", "label": "Bar Farge", "value": document.getElementById('in-bar-color').value },
                "bar_bg_color": { "type": "colorpicker", "label": "Bar Bakgrunn", "value": "rgba(0,0,0,0.3)" },
                "bar_height": { "type": "slider", "label": "Bar Høyde", "value": parseInt(document.getElementById('in-bar-height').value), "min": 5, "max": 40, "step": 1 },
                "bar_radius": { "type": "slider", "label": "Hjørner Bar", "value": parseInt(document.getElementById('in-radius-bar').value), "min": 0, "max": 20, "step": 1 },
                "blink_color": { "type": "colorpicker", "label": "Blink Farge", "value": "#ffffff" },
                "glow_color": { "type": "colorpicker", "label": "Glow Farge", "value": document.getElementById('in-glow-color').value }
            };
            return JSON.stringify(fields, null, 2);
        }

        function simulate() {
            const wrap = document.getElementById('goal-wrapper');
            const bar = document.getElementById('bar-fill-element');
            const glow = document.getElementById('in-glow-color').value;
            wrap.classList.add('dono-alert');
            wrap.style.boxShadow = `0 0 40px ${glow}`;
            bar.classList.add('flashing');
            setTimeout(() => {
                wrap.classList.remove('dono-alert');
                wrap.style.boxShadow = "none";
                bar.classList.remove('flashing');
            }, 4000);
        }

        function toggleManual() {
            const m = document.getElementById('manual-area');
            m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
        }

        function showToast() {
            const t = document.getElementById('toast');
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2000);
        }

        function copyHTML() { navigator.clipboard.writeText(getHTML()); showToast(); }
        function copyCSS() { navigator.clipboard.writeText(getCSS()); showToast(); }
        function copyJS() { navigator.clipboard.writeText(getJS()); showToast(); }
        function copyFIELDS() { navigator.clipboard.writeText(getFIELDS()); showToast(); }

        document.querySelectorAll('input, select').forEach(el => el.addEventListener('input', update));
        update();
    </script>
</body>
</html>
